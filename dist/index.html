<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; img-src 'self' blob:; connect-src 'self' blob:; style-src 'self'">
  <title>UHDR</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="web.css">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Add HDR to photos as Ultra HDR JPEGs, right in your browser.">
</head>

<body>
  <aside id="sidebar">
    <header class="titlebar">
      <span class="app-name">UHDR</span>
      <span id="file-name" class="file-name"></span>
    </header>

    <div class="scroll">
      <section class="row">
        <button id="open">Open…</button>
        <button id="export" class="primary" disabled>Export…</button>
      </section>

      <section>
        <h2>Brighten</h2>
        <div class="seg" id="mode" role="radiogroup">
          <button data-value="auto" class="on" title="Brighten highlights automatically">Auto</button>
          <button data-value="mask" title="Paint where to brighten">Mask</button>
        </div>

        <label class="slider">
          <span>Boost <output id="boost-out"></output></span>
          <input id="boost" type="range" min="1" max="8" step="0.1" value="4">
        </label>

        <label class="slider" data-mode="auto">
          <span>Threshold <output id="threshold-out"></output></span>
          <input id="threshold" type="range" min="0" max="0.95" step="0.01" value="0.6">
        </label>
      </section>

      <section data-mode="mask">
        <h2>Brush</h2>
        <div class="seg" id="tool" role="radiogroup">
          <button data-value="paint" class="on" title="Paint (B)">Paint</button>
          <button data-value="erase" title="Erase (E) · hold ⌥ to flip">Erase</button>
        </div>
        <label class="slider">
          <span>Size <output id="size-out"></output></span>
          <input id="size" type="range" min="2" max="800" step="1" value="120">
        </label>
        <label class="slider">
          <span>Softness <output id="softness-out"></output></span>
          <input id="softness" type="range" min="0" max="1" step="0.01" value="0.6">
        </label>
        <label class="slider">
          <span>Strength <output id="strength-out"></output></span>
          <input id="strength" type="range" min="0.05" max="1" step="0.01" value="1">
        </label>

        <div class="grid">
          <button id="seed" title="Start the mask from the automatic highlight curve">From highlights</button>
          <button id="invert">Invert</button>
          <button id="fill">Fill</button>
          <button id="clear">Clear</button>
          <button id="load-mask">Load PNG…</button>
          <button id="save-mask">Save PNG…</button>
        </div>

        <label class="check"><input id="overlay" type="checkbox" checked> Show mask <kbd>M</kbd></label>
        <label class="slider">
          <span>Overlay opacity <output id="overlay-opacity-out"></output></span>
          <input id="overlay-opacity" type="range" min="0.1" max="1" step="0.05" value="0.55">
        </label>
      </section>

      <section>
        <h2>View</h2>
        <div class="seg" id="view" role="radiogroup">
          <button data-value="hdr" class="on" title="HDR (H)">HDR</button>
          <button data-value="sdr" title="SDR base image (S)">SDR</button>
          <button data-value="split" title="Split (\)">Split</button>
        </div>
        <div class="row small">
          <button id="fit" title="Fit (0)">Fit</button>
          <button id="actual" title="100% (1)">100%</button>
          <output id="zoom-out"></output>
        </div>
      </section>

      <section>
        <h2>Output</h2>
        <label class="slider">
          <span>JPEG quality <output id="quality-out"></output></span>
          <input id="quality" type="range" min="60" max="100" step="1" value="95">
        </label>
      </section>
    </div>

    <footer id="status">
      <div class="local-note">Runs in your browser: images never leave your device.</div>
      <div><span id="display-hdr" class="dot"></span><span id="display-text"></span></div>
      <div id="info"></div>
      <div id="render-status"></div>
    </footer>
  </aside>

  <main id="viewport">
    <div id="empty">
      <div class="drop-target">
        <strong>Drop an image</strong>
        <span>jpg · png · webp · avif — or ⌘O</span>
        <span class="hint">Drop a <code>*.mask.png</code> to load it as the mask</span>
      </div>
    </div>
    <div id="stage" hidden>
      <canvas id="source"></canvas>
      <img id="preview-hdr" alt="" draggable="false" hidden>
      <img id="preview-sdr" alt="" draggable="false" hidden>
      <canvas id="mask"></canvas>
      <canvas id="stroke"></canvas>
    </div>
    <div id="divider" hidden></div>
    <div id="cursor" hidden></div>
    <div id="busy" hidden></div>
  </main>

  <script type="module" src="api.js"></script>
  <script type="module" src="app.js"></script>
</body>

</html>
